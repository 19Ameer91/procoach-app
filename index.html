<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GFA SOVEREIGN - الميدان الشامل v6</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --pitch: #2e7d32; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #1a1a1a; color: white; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* شريط الأدوات */
        .toolbar { background: #222; padding: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; border-bottom: 2px solid var(--gold); }
        .btn { background: #444; color: white; border: 1px solid var(--gold); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn:hover { background: var(--gold); color: black; }
        .btn-play { background: #059669 !important; border: none; }

        /* الميدان */
        #pitch-area { flex: 1; position: relative; width: 100%; display: flex; justify-content: center; align-items: center; }
        #pitch { 
            width: 92%; max-width: 750px; height: 85%; background: var(--pitch); 
            border: 4px solid white; border-radius: 8px; position: relative; overflow: hidden;
            background-image: linear-gradient(to bottom, transparent 49.5%, white 50%, white 50.5%, transparent 51%);
        }
        canvas { position: absolute; top: 0; left: 0; z-index: 5; touch-action: none; }

        /* اللاعب والكرة */
        .player { 
            position: absolute; width: 34px; height: 34px; background: var(--gold); 
            border-radius: 50%; border: 2px solid white; display: flex; 
            align-items: center; justify-content: center; font-weight: bold; 
            color: black; cursor: move; z-index: 100; font-size: 14px; box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        #ball { 
            position: absolute; width: 20px; height: 20px; background: white; 
            border-radius: 50%; border: 2px solid black; z-index: 50; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        
        /* خطوط إضافية */
        .penalty { position: absolute; width: 40%; height: 18%; border: 2px solid white; left: 30%; }
        .top { top: 0; border-top: none; } .bottom { bottom: 0; border-bottom: none; }
    </style>
</head>
<body>

<div class="toolbar">
    <select id="formation" class="btn" onchange="applyFormation()">
        <option value="442">4-4-2</option>
        <option value="433">4-3-3</option>
        <option value="352">3-5-2</option>
    </select>
    <button class="btn" onclick="setMode('arrow')">📏 سهم</button>
    <button class="btn" onclick="clearDraw()">🗑️ مسح الرسم</button>
    <button class="btn btn-play" onclick="simulateArc()">▶️ تنفيذ هجمة ساقطة</button>
</div>

<div id="pitch-area">
    <div id="pitch">
        <canvas id="canvas"></canvas>
        <div class="penalty top"></div>
        <div class="penalty bottom"></div>
        <div id="ball" style="top:50%; left:50%;"></div>
    </div>
</div>

<script>
    let canvas = document.getElementById('canvas');
    let ctx = canvas.getContext('2d');
    let lastArrow = null;
    let isDrawing = false;
    let startX, startY;

    window.onload = () => {
        resize();
        initPlayers();
    };

    function resize() {
        canvas.width = document.getElementById('pitch').clientWidth;
        canvas.height = document.getElementById('pitch').clientHeight;
    }

    // --- رسم السهم التكتيكي ---
    canvas.onmousedown = canvas.ontouchstart = (e) => {
        isDrawing = true;
        let r = canvas.getBoundingClientRect();
        startX = (e.clientX || e.touches[0].clientX) - r.left;
        startY = (e.clientY || e.touches[0].clientY) - r.top;
    };

    canvas.onmouseup = canvas.ontouchend = (e) => {
        if(!isDrawing) return;
        let r = canvas.getBoundingClientRect();
        let endX = (e.clientX || (e.changedTouches ? e.changedTouches[0].clientX : startX)) - r.left;
        let endY = (e.clientY || (e.changedTouches ? e.changedTouches[0].clientY : startY)) - r.top;
        
        ctx.clearRect(0,0,canvas.width, canvas.height);
        drawArrow(startX, startY, endX, endY);
        lastArrow = {x1:startX, y1:startY, x2:endX, y2:endY};
        isDrawing = false;
    };

    function drawArrow(x1, y1, x2, y2) {
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
        ctx.strokeStyle = "yellow"; ctx.lineWidth = 4; ctx.stroke();
        let angle = Math.atan2(y2-y1, x2-x1);
        ctx.lineTo(x2-15*Math.cos(angle-Math.PI/6), y2-15*Math.sin(angle-Math.PI/6));
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2-15*Math.cos(angle+Math.PI/6), y2-15*Math.sin(angle+Math.PI/6));
        ctx.stroke();
    }

    // --- محرك الكرة الساقطة ---
    function simulateArc() {
        if(!lastArrow) return;
        let p = 0;
        let b = document.getElementById('ball');
        let move = () => {
            if(p <= 1) {
                let x = lastArrow.x1 + (lastArrow.x2 - lastArrow.x1) * p;
                let y = lastArrow.y1 + (lastArrow.y2 - lastArrow.y1) * p;
                let h = 80 * Math.sin(Math.PI * p); // تأثير الارتفاع
                b.style.left = (x - 10) + "px";
                b.style.top = (y - 10 - h) + "px";
                b.style.transform = `scale(${1 + h/100})`;
                p += 0.02;
                requestAnimationFrame(move);
            } else { b.style.transform = "scale(1)"; }
        };
        move();
    }

    // --- نظام الـ 11 لاعباً ---
    function initPlayers() {
        let pArea = document.getElementById('pitch');
        for(let i=1; i<=11; i++) {
            let p = document.createElement('div');
            p.className = 'player'; p.innerText = i;
            p.style.left = (i*7) + "%"; p.style.top = "20%";
            makeDraggable(p, pArea);
            pArea.appendChild(p);
        }
    }

    function makeDraggable(el, container) {
        let dragging = false;
        let start = () => dragging = true;
        let stop = () => dragging = false;
        let move = (e) => {
            if(!dragging) return;
            let r = container.getBoundingClientRect();
            let x = (e.clientX || e.touches[0].clientX) - r.left;
            let y = (e.clientY || e.touches[0].clientY) - r.top;
            el.style.left = (x - 17) + "px";
            el.style.top = (y - 17) + "px";
        };
        el.onmousedown = el.ontouchstart = start;
        window.addEventListener('mousemove', move);
        window.addEventListener('touchmove', move, {passive:false});
        window.addEventListener('mouseup', stop);
        window.addEventListener('touchend', stop);
    }

    function clearDraw() { ctx.clearRect(0,0,canvas.width, canvas.height); lastArrow=null; }
</script>
</body>
</html>
