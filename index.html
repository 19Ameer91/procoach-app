<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GFA SOVEREIGN - PRO TACTICS v8 🛡️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --pitch: #228B22; --active-tool: #059669; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #1a1a1a; color: white; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* 🛡️ شريط الهوية v8 */
        #gfa-header { position: absolute; top: 15px; left: 15px; z-index: 1000; text-align: center; pointer-events: none; }
        #gfa-header h1 { font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 26px; color: var(--gold); margin: 0; text-shadow: 0 4px 8px rgba(0,0,0,0.6); }
        #gfa-header p { font-size: 11px; color: rgba(255,255,255,0.85); margin: 0; letter-spacing: 1px; }

        /* 🛠️ شريط الأدوات v8 */
        #tactical-toolbar { background: rgba(0,0,0,0.85); padding: 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; border-bottom: 3px solid var(--gold); z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .tool-btn { background: #444; color: white; border: 1px solid var(--gold); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; font-family: 'Cairo', sans-serif; transition: 0.2s; }
        .tool-btn:hover { background: var(--gold); color: black; transform: translateY(-2px); }
        .tool-btn.active { background: var(--active-tool); border-color: var(--active-tool); box-shadow: 0 0 12px var(--active-tool); }

        /* 🏟️ الميدان الخرافيv8 - تجسيد المنظور */
        #tactical-arena { flex: 1; display: flex; justify-content: center; align-items: center; background: #111; perspective: 1200px; /* 🧱 عمق المنظور */ }
        #pitch { 
            width: 95%; max-width: 800px; height: 90%; background: var(--pitch); border: 5px solid white; border-radius: 8px; position: relative; overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.7);
            /* رسم العشب المخططv8 برمجياً */
            background-image: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,0,0,0.03) 40px, rgba(0,0,0,0.03) 80px),
                             linear-gradient(to bottom, transparent 49.5%, white 50%, white 50.5%, transparent 51%);
            /* 🎥 قلب المنظور ثلاثي الأبعاد */
            transform-style: preserve-3d;
            transform: rotateX(20deg) translateY(-20px); 
        }

        /* الكانفاس (الرسم التكتيكي) */
        #canvas-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; touch-action: none; cursor: crosshair; }

        /* مناطق الجزاء v8 */
        .penalty-area { position: absolute; width: 44%; height: 18%; border: 3px solid white; left: 28%; z-index: 2; transform: translateZ(1px); }
        .pa-top { top: 0; border-top: none; } .pa-bottom { bottom: 0; border-bottom: none; }
        .goal-box { position: absolute; width: 22%; height: 6%; border: 3px solid white; left: 39%; z-index: 1; background: rgba(255,255,255,0.15); }

        /* ⚽ اللاعبv8 مع الاسم */
        .player-wrapper { position: absolute; display: flex; flex-direction: column; align-items: center; z-index: 100; touch-action: none; cursor: move; transform-style: preserve-3d; transform: translateZ(10px); }
        .player-circle { width: 32px; height: 32px; background: var(--gold); border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-weight: bold; color: black; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 14px; transform: translateZ(11px); }
        .player-name { background: rgba(0,0,0,0.75); color: white; font-size: 9px; padding: 2px 5px; border-radius: 4px; margin-bottom: 2px; white-space: nowrap; border: 1px solid var(--gold); font-weight: bold; }
        /* الظل خلف اللاعبv8 للعمق */
        .player-shadow { position: absolute; bottom: -8px; width: 24px; height: 12px; background: rgba(0,0,0,0.4); border-radius: 50%; filter: blur(2px); transform: translateZ(1px); z-index: -1; }

        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; text-align: center; }
    </style>
</head>
<body>

    <div id="gfa-header">
        <h1>GFA</h1>
        <p>SOVEREIGN v8 PRO</p>
    </div>

    <div id="tactical-toolbar">
        <select id="formationSelect" class="tool-btn" onchange="applyWorldFormation()">
            <option value="">🏁 التشكيلات العالمية</option>
            <option value="442">4-4-2 Classic</option>
            <option value="433">4-3-3 Attack</option>
            <option value="352">3-5-2 Control</option>
        </select>
        <button class="tool-btn" onclick="setMode('arrow')">📏 رسم سهم تمرير</button>
        <button class="tool-btndanger" onclick="clearCanvas()">🗑️ مسح الميدان</button>
    </div>

    <div id="tactical-arena">
        <div id="pitch">
            <canvas id="canvas-layer"></canvas>
            
            <div class="goal-box" style="top:0;"></div>
            <div class="penalty-area pa-top"></div>
            
            <div class="penalty-area pa-bottom"></div>
            <div class="goal-box" style="bottom:0;"></div>
            
            <div style="position:absolute; top:50%; left:50%; width:110px; height:110px; border:3px solid white; border-radius:50%; transform:translate(-50%, -50%) translateZ(1px); z-index: 2;"></div>
            <div style="position:absolute; top:50%; left:50%; width:4px; height:4px; background:white; border-radius:50%; transform:translate(-50%, -50%) translateZ(2px); z-index: 3;"></div>
        </div>
    </div>

    <script>
        window.onload = () => { initCanvas(); initPlayers(); };
        window.onresize = initCanvas;

        function initCanvas() {
            const canvas = document.getElementById('canvas-layer');
            const pitch = document.getElementById('pitch');
            canvas.width = pitch.clientWidth;
            canvas.height = pitch.clientHeight;
        }

        // --- نظام الـ 11 لاعباً وتوزيع الأبطال v8 ---
        const playerNames = ["الحارس", "دفاع 1", "دفاع 2", "ظهير يمين", "ظهير يسار", "وسط 1", "وسط 2", "جناح يمين", "جناح يسار", "هجوم 1", "هجوم 2"];

        function initPlayers() {
            const pitch = document.getElementById('pitch');
            document.querySelectorAll('.player-wrapper').forEach(el => el.remove());
            
            for(let i=0; i<11; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'player-wrapper';
                // تجسيد v8: الاسم + الدائرة + الظل
                wrapper.innerHTML = `<span class="player-name">${playerNames[i]}</span><div class="player-circle">${i+1}</div><div class="player-shadow"></div>`;
                
                // توزيع مبدئي (سيتم استبداله بالتشكيلة)
                wrapper.style.top = (15 + (i*6)) + "%";
                wrapper.style.left = (10 + (i*7)) + "%";
                
                makeDraggable(wrapper, pitch);
                pitch.appendChild(wrapper);
            }
        }

        const formations = {
            '442': [{t:5,l:44.5},{t:22,l:35},{t:22,l:54},{t:25,l:15},{t:25,l:74},{t:48,l:35},{t:48,l:54},{t:52,l:10},{t:52,l:79},{t:78,l:35},{t:78,l:54}],
            '433': [{t:5,l:44.5},{t:22,l:35},{t:22,l:54},{t:25,l:15},{t:25,l:74},{t:50,l:44.5},{t:50,l:25},{t:50,l:64},{t:80,l:44.5},{t:80,l:15},{t:80,l:74}]
        };

        function applyWorldFormation() {
            const f = document.getElementById('formationSelect').value;
            if(!f || !formations[f]) return;
            const players = document.querySelectorAll('.player-wrapper');
            const pitch = document.getElementById('pitch').getBoundingClientRect();
            
            formations[f].forEach((pos, i) => {
                if(players[i]) {
                    // تحويل النسبة المئوية لإحداثيات بكسل دقيقة
                    const newTop = (pos.t / 100) * pitch.height;
                    const newLeft = (pos.l / 100) * pitch.width;
                    players[i].style.top = newTop + "px";
                    players[i].style.left = newLeft + "px";
                }
            });
        }

        function makeDraggable(elm, container) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elm.onmousedown = elm.ontouchstart = dragStart;

            function dragStart(e) {
                pos3 = e.clientX || e.touches[0].clientX;
                pos4 = e.clientY || e.touches[0].clientY;
                document.onmouseup = document.ontouchend = closeDrag;
                document.onmousemove = document.ontouchmove = elementDrag;
            }

            function elementDrag(e) {
                let cx = e.clientX || e.touches[0].clientX;
                let cy = e.clientY || e.touches[0].clientY;
                pos1 = pos3 - cx; pos2 = pos4 - cy;
                pos3 = cx; pos4 = cy;
                let newT = elm.offsetTop - pos2, newL = elm.offsetLeft - pos1;
                const rect = container.getBoundingClientRect();
                // منع الحركة خارج حدود الملعب ثلاثي الأبعاد
                if (newT >= 0 && newT <= rect.height - 55) elm.style.top = newT + "px";
                if (newL >= 0 && newL <= rect.width - 45) elm.style.left = newL + "px";
            }

            function closeDrag() {
                document.onmouseup = null; document.onmousemove = null;
                document.ontouchend = null; document.ontouchmove = null;
            }
        }
    </script>
</body>
</html>
