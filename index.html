<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GFA SOVEREIGN - PRO TACTICS 3D v8 🛡️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
    :root { 
        --pitch-green: #1a5e1a; /* لون نجيل أعمق وواقعي */
        --line-color: rgba(255, 255, 255, 0.9);
        --gold: #d4af37;
    }

    /* 🏟️ تحسين مظهر الميدان ليبدو كأنه عشب طبيعي */
    #pitch { 
        background: var(--pitch-green);
        background-image: 
            /* تأثير العشب المقصوص */
            repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(0,0,0,0.05) 50px, rgba(0,0,0,0.05) 100px),
            /* ملمس النجيل (Noise) */
            url('https://www.transparenttextures.com/patterns/grass.png'); 
        border: 4px solid white;
        box-shadow: inset 0 0 100px rgba(0,0,0,0.3), 0 20px 50px rgba(0,0,0,0.5);
        transform: rotateX(15deg); /* ميلان خفيف للمنظور */
    }

    /* ⚽ اللاعبون بظلال واقعية */
    .player-unit {
        filter: drop-shadow(0 8px 4px rgba(0,0,0,0.4)); /* ظل ساقط على العشب */
    }

    .p-circle {
        background: linear-gradient(135deg, var(--gold) 0%, #b8860b 100%); /* تأثير ذهبي معدني */
        border: 2px solid #fff;
        box-shadow: 0 4px 0 rgba(0,0,0,0.2); /* عمق للدائرة */
    }

    /* 🥅 المرمى والشبك بتفصيل أكثر */
    .goal-box {
        border: 2px solid var(--line-color);
        background: rgba(255,255,255,0.1);
        box-shadow: 0 0 15px rgba(255,255,255,0.1);
    }
</style>
</head>
<body>

    <div id="gfa-header">
        <h1>GFA</h1>
        <p>SOVEREIGN v8 3D</p>
    </div>

    <div id="tactical-toolbar">
        <select id="formationSelect" class="tool-btn" onchange="applyWorldFormation()">
            <option value="">🏁 التشكيلات العالمية</option>
            <option value="442">4-4-2 Classic</option>
            <option value="433">4-3-3 Attacking</option>
            <option value="352">3-5-2 Control</option>
        </select>
        <button class="tool-btn" onclick="setMode('arrow')">📏 رسم سهم مقوس (تمرير)</button>
        <button class="tool-btn" onclick="toggleFootball()">🏀 تفعيل الكرة</button>
        <button class="tool-btn danger" onclick="clearFullCanvas()">🗑️ مسح الرسم</button>
        <button id="playBtn" class="tool-btn btn-play" onclick="simulateArcAction()">▶️ محاكاة الحركة المقوسة</button>
    </div>

    <div id="tactical-arena">
        <div id="pitch">
            <canvas id="canvas-layer"></canvas>
            
            <div class="penalty-area pa-top"></div>
            <div class="penalty-area pa-bottom"></div>
            
            <div style="position:absolute; top:50%; left:50%; width:110px; height:110px; border:3px solid white; border-radius:50%; transform:translate(-50%, -50%) translateZ(1px); z-index: 2;"></div>
            
            <div id="football"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        const ball = document.getElementById('football');
        const pitch = document.getElementById('pitch');
        let isDrawing = false;
        let lastArrow = null; // تخزين مسار الحركة
        let mode = 'idle'; // idle, arrow

        window.onload = () => { resizeCanvas(); initPlayers(); };
        window.onresize = resizeCanvas;

        function resizeCanvas() {
            canvas.width = pitch.clientWidth;
            canvas.height = pitch.clientHeight;
        }

        // --- 1. نظام الـ 11 لاعباً وتوزيع الصورة ---
        const playerNames = ["الحارس", "دفاع 1", "دفاع 2", "ظهير", "ظهير", "وسط", "وسط", "جناح", "جناح", "هجوم", "هجوم"];
        const playerColors = ["#fca311", "#ff4d4d", "#ff4d4d", "#ff4d4d", "#ff4d4d", "#fff", "#fff", "#fff", "#fff", "#fff", "#fff"]; // ألوان مختلفة لتقريب الشكل

        function initPlayers() {
            document.querySelectorAll('.player-wrapper').forEach(el => el.remove());
            for(let i=0; i<11; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'player-wrapper';
                wrapper.innerHTML = `<span class="player-name">${playerNames[i]}</span><div class="player-circle">${i+1}</div>`;
                wrapper.style.top = (15 + (i*6)) + "%"; wrapper.style.left = (10 + (i*7)) + "%"; // توزيع مبدئي
                makeDraggable(wrapper, pitch);
                pitch.appendChild(wrapper);
            }
        }

        // --- 2. نظام الرسم التكتيكي (الأسهم المقوسة) ---
        function setMode(m) { mode = m; alert(`تم تفعيلمود: ${m === 'arrow' ? 'رسم سهم تمرير مقوس' : 'حركة حرة'}`); }
        function clearFullCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); lastArrow = null; }

        let startX, startY;
        canvas.addEventListener('mousedown', (e) => startDraw(e));
        window.addEventListener('mousemove', (e) => draw(e));
        window.addEventListener('mouseup', (e) => stopDraw(e));
        canvas.addEventListener('touchstart', (e) => startDraw(e.touches[0]));
        window.addEventListener('touchmove', (e) => draw(e.touches[0]));
        window.addEventListener('touchend', (e) => stopDraw(e.changedTouches[0]));

        function startDraw(e) {
            if(mode !== 'arrow') return;
            isDrawing = true;
            const r = canvas.getBoundingClientRect();
            startX = (e.clientX || e.pageX) - r.left;
            startY = (e.clientY || e.pageY) - r.top;
        }

        function draw(e) { if(!isDrawing) return; } // لا نرسم شيئاً أثناء السحب

        function stopDraw(e) {
            if(mode !== 'arrow' || !isDrawing) return;
            const r = canvas.getBoundingClientRect();
            const cx = (e.clientX || e.pageX) - r.left;
            const cy = (e.clientY || e.pageY) - r.top;
            
            // رسم سهم تكتيكي برأس مدبب (مستقيم برمجياً لكن سيتأثر بالمنظور)
            drawTacticalArrow(startX, startY, cx, cy);
            lastArrow = { x1: startX, y1: startY, x2: cx, y2: cy };
            isDrawing = false;
        }

        function drawTacticalArrow(x1, y1, x2, y2) {
            ctx.clearRect(0,0,canvas.width, canvas.height); // مسح لرسم سهم جديد
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
            ctx.strokeStyle = "rgba(255,255,255,0.7)"; // أبيض تكتيكي
            ctx.lineWidth = 3; ctx.stroke();
            const angle = Math.atan2(y2-y1, x2-x1);
            ctx.lineTo(x2-15*Math.cos(angle-Math.PI/6), y2-15*Math.sin(angle-Math.PI/6));
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2-15*Math.cos(angle+Math.PI/6), y2-15*Math.sin(angle+Math.PI/6));
            ctx.stroke();
        }

        // --- 3. نظام المحاكاة الفيزيائية (الكرة المقوسةv8) ---
        function toggleFootball() { ball.style.display = (ball.style.display === "none" ? "block" : "none"); makeBallDraggable(ball, pitch); }

        function simulateArcAction() {
            if(!lastArrow) return alert("يا قائد علي، ارسم سهم تمرير أولاً!");
            
            let progress = 0; const speed = 0.015;
            let animate = () => {
                if (progress <= 1) {
                    const x = lastArrow.x1 + (lastArrow.x2 - lastArrow.x1) * progress;
                    const y = lastArrow.y1 + (lastArrow.y2 - lastArrow.y1) * progress;
                    
                    // --- محرك الفيزياء المقوسة v8 ---
                    // نستخدم معادلة القطع المكافئ (Arc): h = 4 * height * p * (1-p)
                    const jumpHeight = 70; // قوة الارتفاع الساقط
                    const offset = 4 * jumpHeight * progress * (1 - progress);
                    
                    ball.style.left = (x - 10) + "px";
                    ball.style.top = (y - 10 - offset) + "px"; // ترتفع ثم تنخفض
                    
                    // تغيير حجم الكرة ليوحي بالارتفاع (تأثير بصري ثلاثي الأبعاد)
                    const scale = 1 + (offset / 100);
                    ball.style.transform = `scale(${scale})`;
                    ball.style.opacity = 1;

                    progress += speed;
                    requestAnimationFrame(animate);
                } else { 
                    ball.style.transform = "scale(1)";
                    setTimeout(() => ball.style.opacity = 0, 500); // إخفاء الكرة بعد الوصول
                }
            }; animate();
        }

        // --- نظام الحركة وإصلاح تعليق اللاعبين v8 ---
        function makeElementDraggable(elm, container) {
            let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
            elm.onmousedown = elm.ontouchstart = (e) => { e.stopPropagation(); dragStart(e); }; // منع تداخل السحب مع الرسم

            function dragStart(e) {
                p3 = e.clientX || e.touches[0].clientX;
                p4 = e.clientY || e.touches[0].clientY;
                document.onmouseup = document.ontouchend = () => { document.onmouseup = null; document.onmousemove = null; document.ontouchend = null; document.ontouchmove = null; };
                document.onmousemove = document.ontouchmove = elementDrag;
            }

            function elementDrag(e) {
                let cx = e.clientX || e.touches[0].clientX;
                let cy = e.clientY || e.touches[0].clientY;
                p1 = p3 - cx; p2 = p4 - cy; p3 = cx; p4 = cy;
                
                let newT = elm.offsetTop - p2;
                let newL = elm.offsetLeft - p1;
                
                const rect = container.getBoundingClientRect();
                // منع الخروج من حدود الملعب ثلاثي الأبعاد
                if (newT >= 0 && newT <= rect.height - 45) elm.style.top = newT + "px";
                if (newL >= 0 && newL <= rect.width - 35) elm.style.left = newL + "px";
            }
        }
        function makeDraggable(el, container) { makeElementDraggable(el, container); } // مرجع قديم
        function makeBallDraggable(el, container) { makeElementDraggable(el, container); } // مرجع قديم
    </script>
</body>
</html>
