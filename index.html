<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>GFA TEST 🛡️</title>
    <style>
        body { background: #0d3d29; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .card { background: white; color: black; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .btn { background: #059669; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login_gate" class="card">
        <h2 style="color: #059669;">تطبيق برو كوتش</h2>
        <p>اضغط الزر بالأسفل لاختبار الدخول</p>
        <button class="btn" onclick="TEST_GO()">دخول الميدان الآن ⚡</button>
    </div>

    <div id="success_field" style="display:none; text-align:center;">
        <h1>✅ تم الاقتحام بنجاح!</h1>
        <p>يا قائد أمير، إذا رأيت هذه الرسالة فالمحرك يعمل.</p>
        <button onclick="location.reload()" style="color:white; background:red; padding:10px; border:none; border-radius:5px;">خروج</button>
    </div>

    <script>
        function TEST_GO() {
            // إخفاء البوابة وإظهار رسالة النجاح فورا
            document.getElementById('login_gate').style.display = 'none';
            document.getElementById('success_field').style.display = 'block';
            alert("تم تفعيل المحرك بنجاح!");
        }
    </script>
</body>
</html>
