<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GFA TITAN v15 | وزارة الرياضة - عُمان</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37; --gold-light: #f5d060; --dark-pitch: #1b5e20;
            --bg-deep: #08080f; --panel-dark: #0c0c18; --wood: #5d4037;
        }

        body { margin: 0; background: var(--bg-deep); color: white; font-family: 'Cairo', sans-serif; overflow: hidden; height: 100vh; }

        /* 🏟️ الميدان الدرامي (تحاكي الاستاد الليلي) */
        #stadium-vignette {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.8) 100%);
            pointer-events: none; z-index: 10;
        }

        #main-arena {
            height: 100vh; display: flex; justify-content: center; align-items: center;
            perspective: 1100px; /* منظور 3D المطلوب */
        }

        /* الإطار الخشبي الملكي v15 */
        #wood-frame {
            padding: 15px; background: var(--wood);
            border: 4px solid var(--gold); border-radius: 12px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9), 0 0 30px rgba(212,175,55,0.2);
            transform: rotateX(28deg); /* المنظور المطلوب */
            transition: 0.5s;
        }

        /* خطوط العشب المحاكة (10 شرائط) */
        #pitch {
            width: 750px; height: 500px; background: var(--dark-pitch);
            background-image: repeating-linear-gradient(90deg, 
                rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 75px, 
                transparent 75px, transparent 150px); /* 10 شرائط عرضية محاكة */
            border: 2px solid rgba(255,255,255,0.8); position: relative;
        }

        /* 💡 أضواء الاستاد (4 نقاط ضوء) */
        .floodlight {
            position: absolute; width: 60px; height: 60px;
            background: radial-gradient(circle, white 0%, transparent 70%);
            opacity: 0.4; filter: blur(10px); z-index: 50;
        }

        /* 🛡️ لوحات التحكم الجانبية (الواجهة الاحترافية) */
        .side-panel {
            position: absolute; top: 0; bottom: 0; width: 220px;
            background: var(--panel-dark); border: 1px solid rgba(212,175,55,0.2);
            backdrop-filter: blur(10px); z-index: 100; padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
        }

        .left-p { left: 0; border-right: 2px solid var(--gold); }
        .right-p { right: 0; border-left: 2px solid var(--gold); }

        /* ⚽ اللاعب والقميص SVG */
        .player-unit {
            position: absolute; cursor: move; z-index: 200;
            filter: drop-shadow(0 8px 5px rgba(0,0,0,0.6)); /* ظل عميق */
        }

        /* ✏️ الرسم بتوهج ذهبي 3 طبقات */
        .drawing-layer {
            position: absolute; inset: 0; pointer-events: none; z-index: 150;
        }

        .formation-btn {
            background: rgba(212,175,55,0.1); border: 1px solid var(--gold);
            color: var(--gold); padding: 8px; border-radius: 5px; cursor: pointer;
            font-size: 11px; transition: 0.3s;
        }
        .formation-btn:hover { background: var(--gold); color: black; }
    </style>
</head>
<body>

    <div id="stadium-vignette"></div>

    <div class="side-panel left-p">
        <h3 style="color:var(--gold); font-size:14px;">🛡️ الفريق المضيف</h3>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
            <button class="formation-btn">4-4-2</button>
            <button class="formation-btn">4-3-3</button>
            <button class="formation-btn">3-5-2</button>
            <button class="formation-btn">4-2-3-1</button>
            <button class="formation-btn">4-5-1</button>
            <button class="formation-btn">5-3-2</button>
            <button class="formation-btn">3-4-3</button>
            <button class="formation-btn">4-1-4-1</button>
        </div>
        <hr style="border:0; border-top:1px solid #333; margin:10px 0;">
        <div style="font-size:10px; color:#aaa;">نقش وزارة الرياضة - عُمان 🇴🇲</div>
    </div>

    <div id="main-arena">
        <div id="wood-frame">
            <div id="pitch">
                <div class="floodlight" style="top:-30px; left:-30px;"></div>
                <div class="floodlight" style="top:-30px; right:-30px;"></div>
                <div class="floodlight" style="bottom:-30px; left:-30px;"></div>
                <div class="floodlight" style="bottom:-30px; right:-30px;"></div>
                
                <div style="position:absolute; top:50%; left:50%; width:120px; height:120px; border:2px solid white; border-radius:50%; transform:translate(-50%, -50%);"></div>
                <div style="position:absolute; top:50%; left:0; right:0; height:2px; background:white;"></div>
            </div>
        </div>
    </div>

    <div class="side-panel right-p">
        <h3 style="color:var(--gold); font-size:14px;">🐆 الفريق الضيف</h3>
        </div>

</body>
</html>
