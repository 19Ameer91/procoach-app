<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Coach - القائد أمير 🛡️</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    
    <style>
        :root { --gold: #d4af37; --deep-green: #0d3d29; --glass: rgba(255, 255, 255, 0.07); }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body
    <div class="header">
        <h1 id="main-title">PRO COACH v2 🛡️</h1>
        <p style="color: #ccc;">إدارة الفرق والخطط التكتيكية</p>
    </div>

    <div id="login-screen" class="glass-card">
        <label>كود الدوري / الغرفة</label>
        <input type="text" id="leagueCode" placeholder="مثال: SALALAH-2026">
        <input type="text" id="userName" placeholder="الاسم الثلاثي">
        <select id="role">
            <option value="ADMIN">مدير الدوري (القائد)</option>
            <option value="COACH">مدرب الفريق</option>
            <option value="PLAYER">لاعب</option>
        </select>
        <button onclick="startApp()">تفعيل وفتح اللوحة ⚡</button>
    </div>
<div id="elite-showcase"></div>
    <div id="tactics-screen" class="glass-card hidden">
        <h2 style="color: var(--gold); text-align: center;">غرفة التكتيك 📋</h2>
        <p style="text-align: center; font-size: 12px;">اسحب اللاعبين لتغيير الخطة التكتيكية</p>
        
        <div id="tactics-board">
            </div>

        <button onclick="saveTactics()" style="margin-top: 20px;">حفظ الخطة الحالية 💾</button>
        <button onclick="showDashboard()" style="background: transparent; border: 1px solid var(--gold); color: var(--gold);">كشوفات اللاعبين 📋</button>
    </div>

    <script>
        // دمج التقنيات الجديدة مع تطبيقك
        function startApp() {
            const league = document.getElementById('leagueCode').value;
            if(!league) return alert("أدخل كود الدوري!");
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('tactics-screen').classList.remove('hidden');
            
            setupPlayers();
        }
<div id="league-setup" class="glass-card">
    <h3 style="color: var(--gold);">إعدادات الميدان الجديد 🛡️</h3>
    
    <label>حدد عدد الفرق المستهدفة:</label>
    <input type="number" id="targetTeams" value="12" min="4" max="32" oninput="updateDeadlineText()">
    
    <div id="deadline-info" style="font-size: 13px; color: #ccc; margin: 10px 0;">
        المهلة الزمنية الممنوحة: <span id="daysCount" style="color: var(--gold); font-weight: bold;">5</span> أيام
    </div>

    <p style="font-size: 11px; color: #ff4444;">⚠️ تنبيه: إذا لم يكتمل العدد المطلوب خلال المهلة، سيتم حذف البيانات تلقائياً (إلا لحاملي VIP).</p>
    
    <button onclick="createOfficialLeague()">تنشيط كود الدوري ⚡</button>
</div>

<script>
    function updateDeadlineText() {
        const teams = document.getElementById('targetTeams').value;
        // معادلة ديناميكية: يوم واحد لكل 3 فرق + يومين إضافيين للتحضير
        const days = Math.ceil(teams / 3) + 2;
        document.getElementById('daysCount').innerText = days;
    }

    async function createOfficialLeague() {
        const teams = document.getElementById('targetTeams').value;
        const days = Math.ceil(teams / 3) + 2;
        const leagueID = document.getElementById('leagueCode').value;

        const leagueConfig = {
            target: teams,
            deadlineDays: days,
            createdAt: new Date().getTime(),
            status: "PENDING",
            isVIP: false // افتراضي
        };

        // حفظ الإعدادات في Firebase تحت كود الدوري
        await fetch(`${baseURL}${leagueID}/config.json`, { method: 'PUT', body: JSON.stringify(leagueConfig) });
        alert(`تم فتح الغرفة! أمامك ${days} أيام لجمع ${teams} فريقاً.`);
    }
</script>
        // إنشاء لاعبين قابلين للسحب والإفلات
        function setupPlayers() {
            const board = document.getElementById('tactics-board');
            for(let i=1; i<=11; i++) {
                const dot = document.createElement('div');
                dot.className = 'player-node';
                dot.innerText = i;
                dot.style.top = (Math.random() * 80) + "%";
                dot.style.left = (Math.random() * 80) + "%";
                
                // إضافة خاصية السحب
                let isDragging = false;
                dot.onmousedown = (e) => isDragging = true;
                window.onmousemove = (e) => {
                    if(isDragging) {
                        const rect = board.getBoundingClientRect();
                        dot.style.left = (e.clientX - rect.left - 15) + "px";
                        dot.style.top = (e.clientY - rect.top - 15) + "px";
                    }
                };
                window.onmouseup = () => isDragging = false;
                
                board.appendChild(dot);
            }
        }

        function saveTactics() {
            alert("تم حفظ الخطة التكتيكية في السحابة بنجاح يا قائد!");
        }
    </script>
</body>
</html>
