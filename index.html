<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GFA SOVEREIGN - الميدان الاحترافي</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --green: #059669; --dark: #0d3d29; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #f0f2f5; direction: rtl; }
        .hidden { display: none !important; }
        
        /* 🏟️ تحويل المنصة لملعب كرة قدم حقيقي (رسم برمجى) */
        #pitch { 
            width: 100%; height: 450px; background: #2e7d32; 
            border: 4px solid white; border-radius: 10px; 
            position: relative; overflow: hidden; margin: 15px auto;
            /* رسم خطوط الملعب */
            background-image: 
                linear-gradient(to bottom, transparent 49%, white 49%, white 51%, transparent 51%),
                radial-gradient(circle, transparent 19%, white 19%, white 21%, transparent 21%);
            background-size: 100% 100%, 150px 150px;
            background-position: center; background-repeat: no-repeat;
        }

        /* ⚽ تصميم اللاعبين */
        .player { 
            width: 35px; height: 35px; background: var(--gold); 
            color: black; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; 
            position: absolute; cursor: move; border: 2px solid white; 
            font-weight: bold; font-size: 14px; z-index: 100;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            touch-action: none; /* لمنع اهتزاز الصفحة في الجوال */
        }

        .card { background: white; border-radius: 12px; padding: 20px; margin: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header { background: linear-gradient(135deg, #1e40af, #059669); color: white; padding: 15px; text-align: center; }
        .btn { background: var(--green); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="gate" style="position:fixed; inset:0; background:var(--dark); z-index:9999; display:flex; justify-content:center; align-items:center;">
        <div style="background:white; padding:30px; border-radius:15px; width:320px; text-align:center;">
            <h2 style="color:var(--green);">GFA SOVEREIGN</h2>
            <input type="text" id="L_CODE" placeholder="كود الدوري">
            <input type="text" id="U_NAME" placeholder="اسمك الكامل">
            <button class="btn" onclick="ACTIVATE()">دخول الميدان ⚡</button>
        </div>
    </div>

    <div id="arena" class="hidden">
        <div class="header">
            <h2 id="title">دوري: </h2>
            <p>القائد: <span id="userDisp"></span></p>
        </div>
        
        <div class="card" style="background:#222;">
            <h3 style="color:white; text-align:center;">غرفة التكتيك 📐</h3>
            <div id="pitch"></div>
            <button class="btn" style="background:var(--gold); color:black;" onclick="loadPitch()">إعادة رص الصفوف 🔄</button>
        </div>
    </div>

    <script>
        function ACTIVATE() {
            const code = document.getElementById('L_CODE').value.toUpperCase();
            const name = document.getElementById('U_NAME').value;
            if(!code || !name) return alert("أكمل البيانات!");

            document.getElementById('gate').classList.add('hidden');
            document.getElementById('arena').classList.remove('hidden');
            document.getElementById('userDisp').innerText = name;
            document.getElementById('title').innerText = "دوري: " + code;
            
            loadPitch();
        }

        function loadPitch() {
            const pitch = document.getElementById('pitch');
            pitch.innerHTML = ""; 
            
            for(let i=1; i<=11; i++) {
                const p = document.createElement('div');
                p.className = 'player';
                p.innerText = i;
                
                // توزيع اللاعبين بشكل أولي
                p.style.top = "45%";
                p.style.left = (i * 8) + "%";
                
                // تفعيل السحب لكل لاعب بشكل مستقل
                makeElementDraggable(p, pitch);
                
                pitch.appendChild(p);
            }
        }

        // محرك السحب الشامل لجميع اللاعبين
        function makeElementDraggable(elm, container) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

            elm.onmousedown = dragMouseDown;
            elm.ontouchstart = dragMouseDown;

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX || e.touches[0].clientX;
                pos4 = e.clientY || e.touches[0].clientY;
                document.onmouseup = closeDragElement;
                document.ontouchend = closeDragElement;
                document.onmousemove = elementDrag;
                document.ontouchmove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                let clientX = e.clientX || e.touches[0].clientX;
                let clientY = e.clientY || e.touches[0].clientY;
                
                pos1 = pos3 - clientX;
                pos2 = pos4 - clientY;
                pos3 = clientX;
                pos4 = clientY;

                let newTop = elm.offsetTop - pos2;
                let newLeft = elm.offsetLeft - pos1;

                // قيد الحركة داخل حدود الملعب
                const rect = container.getBoundingClientRect();
                if (newTop >= 0 && newTop <= rect.height - 35) elm.style.top = newTop + "px";
                if (newLeft >= 0 && newLeft <= rect.width - 35) elm.style.left = newLeft + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.ontouchend = null;
                document.ontouchmove = null;
            }
        }
    </script>
</body>
</html>
