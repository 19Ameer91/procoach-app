<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GFA TITAN v13 | المحرك التكتيكي الشامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --pitch: #228B22; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #000; color: white; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* شريط الأدوات السفلي */
        .dock { background: rgba(20,20,20,0.95); padding: 15px; display: flex; justify-content: space-around; border-top: 2px solid var(--gold); z-index: 1000; }
        .dock-btn { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: #888; transition: 0.3s; }
        .dock-btn:hover, .dock-btn.active { color: var(--gold); transform: translateY(-5px); }
        .dock-btn span { font-size: 10px; margin-top: 5px; font-weight: bold; }
        .play-btn { color: #059669 !important; }

        /* الميدان والمنظور */
        #arena { flex: 1; position: relative; perspective: 1500px; display: flex; justify-content: center; align-items: center; background: #111; }
        #pitch { 
            width: 90%; max-width: 800px; height: 85%; background: var(--pitch); 
            border: 5px solid white; border-radius: 5px; position: relative; 
            transform: rotateX(20deg); transform-style: preserve-3d;
            box-shadow: 0 50px 100px rgba(0,0,0,0.7);
            background-image: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,0,0,0.05) 40px, rgba(0,0,0,0.05) 80px);
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 10; touch-action: none; pointer-events: none; }
        #interaction-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; }

        /* اللاعبين والكرة */
        .player { position: absolute; display: flex; flex-direction: column; align-items: center; z-index: 100; cursor: move; touch-action: none; }
        .p-circle { width: 34px; height: 34px; background: var(--gold); border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; color: black; font-weight: 900; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .p-label { background: black; font-size: 8px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--gold); margin-bottom: 2px; }
        #ball { position: absolute; width: 22px; height: 22px; background: white; border-radius: 50%; border: 2px solid black; z-index: 150; box-shadow: 0 10px 20px rgba(0,0,0,0.5); display: none; }
    </style>
</head>
<body>

<div id="arena">
    <div id="pitch">
        <canvas id="canvas"></canvas>
        <div id="interaction-layer"></div>
        <div id="ball"></div>
        <div style="position:absolute; top:0; left:30%; width:40%; height:18%; border:3px solid white; border-top:none;"></div>
        <div style="position:absolute; bottom:0; left:30%; width:40%; height:18%; border:3px solid white; border-bottom:none;"></div>
        <div style="position:absolute; top:50%; left:50%; width:120px; height:120px; border:3px solid white; border-radius:50%; transform:translate(-50%, -50%);"></div>
        <div style="position:absolute; top:50%; width:100%; height:2px; background:white;"></div>
    </div>
</div>

<div class="dock">
    <div class="dock-btn" onclick="applyFormation('442')">🏟️<span>4-4-2</span></div>
    <div class="dock-btn" onclick="setMode('curve')">📏<span>رسم المسار</span></div>
    <div class="dock-btn" onclick="toggleBall()">⚽<span>إظهار الكرة</span></div>
    <div class="dock-btn" onclick="clearAll()">🗑️<span>مسح</span></div>
    <div class="dock-btn play-btn" onclick="runCinematic()">▶️<span>تشغيل تكتيكي</span></div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const ball = document.getElementById('ball');
    const layer = document.getElementById('interaction-layer');
    const pitch = document.getElementById('pitch');
    let points = []; 
    let isDrawing = false;
    let mode = 'curve';

    window.onload = () => { resize(); initPlayers(); applyFormation('442'); };
    window.onresize = resize;

    function resize() {
        canvas.width = pitch.clientWidth;
        canvas.height = pitch.clientHeight;
    }

    // --- نظام الرسم الهندسي ---
    layer.onmousedown = layer.ontouchstart = (e) => {
        isDrawing = true; points = [];
        ctx.clearRect(0,0,canvas.width, canvas.height);
    };

    layer.onmousemove = layer.ontouchmove = (e) => {
        if(!isDrawing) return;
        const r = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - r.left;
        const y = (e.clientY || e.touches[0].clientY) - r.top;
        points.push({x, y});
        drawPath();
    };

    layer.onmouseup = layer.ontouchend = () => isDrawing = false;

    function drawPath() {
        if(points.length < 2) return;
        ctx.beginPath(); ctx.strokeStyle = "var(--gold)"; ctx.lineWidth = 3;
        ctx.setLineDash([5, 5]); // خطوط متقطعة تكتيكية
        ctx.moveTo(points[0].x, points[0].y);
        for(let i=1; i<points.length; i++) ctx.lineTo(points[i].x, points[i].y);
        ctx.stroke();
    }

    // --- المحرك الفيزيائي v13 (مستقيم vs مقوس) ---
    function runCinematic() {
        if(points.length < 5) return alert("ارسم مساراً أولاً!");
        ball.style.display = "block";
        
        const first = points[0], last = points[points.length-1];
        const mid = points[Math.floor(points.length/2)];
        // حساب هل المسار منحني أم مستقيم
        const isCurved = Math.abs(mid.y - (first.y + last.y)/2) > 20;
        
        let i = 0;
        function animate() {
            if(i < points.length) {
                const p = points[i];
                const progress = i / points.length;
                
                // ارتفاع الكرة (عالي للمنحني، منخفض للمستقيم)
                const maxHeight = isCurved ? 80 : 25;
                const arc = Math.sin(progress * Math.PI) * maxHeight;
                
                ball.style.left = (p.x - 11) + "px";
                ball.style.top = (p.y - 11 - arc) + "px";
                ball.style.transform = `scale(${1 + arc/100})`;
                
                // إمالة الملعب مع الكرة
                pitch.style.transform = `rotateX(${20 + (p.y/canvas.height)*10}deg) rotateY(${(p.x/canvas.width - 0.5)*5}deg)`;

                i++; requestAnimationFrame(animate);
            } else {
                pitch.style.transform = "rotateX(20deg) rotateY(0deg)";
            }
        }
        animate();
    }

    // --- إدارة اللاعبين ---
    const names = ["GK", "CB", "CB", "RB", "LB", "CM", "CM", "RW", "LW", "ST", "ST"];
    function initPlayers() {
        layer.innerHTML = "";
        for(let i=1; i<=11; i++) {
            const div = document.createElement('div');
            div.className = 'player';
            div.innerHTML = `<div class="p-label">${names[i-1]}</div><div class="p-circle">${i}</div>`;
            makeDraggable(div);
            layer.appendChild(div);
        }
    }

    function applyFormation(type) {
        const players = document.querySelectorAll('.player');
        const pos = [
            {t:5, l:45}, {t:22, l:35}, {t:22, l:55}, {t:25, l:15}, {t:25, l:75},
            {t:50, l:38}, {t:50, l:52}, {t:55, l:10}, {t:55, l:80}, {t:80, l:35}, {t:80, l:55}
        ];
        players.forEach((p, i) => {
            p.style.top = pos[i].t + "%"; p.style.left = pos[i].l + "%";
        });
    }

    function makeDraggable(el) {
        let drag = false;
        el.onmousedown = el.ontouchstart = () => drag = true;
        window.onmousemove = window.ontouchmove = (e) => {
            if(!drag) return;
            const r = canvas.getBoundingClientRect();
            const x = (e.clientX || (e.touches ? e.touches[0].clientX : 0)) - r.left;
            const y = (e.clientY || (e.touches ? e.touches[0].clientY : 0)) - r.top;
            el.style.left = (x - 17) + "px"; el.style.top = (y - 30) + "px";
        };
        window.onmouseup = window.ontouchend = () => drag = false;
    }

    function toggleBall() { ball.style.display = ball.style.display === "none" ? "block" : "none"; ball.style.top="50%"; ball.style.left="50%"; }
    function clearAll() { ctx.clearRect(0,0,canvas.width, canvas.height); points=[]; ball.style.display="none"; }
</script>
</body>
</html>
