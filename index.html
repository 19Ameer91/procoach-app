<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GFA SOVEREIGN - PRO COACH</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { --gold: #d4af37; --green: #059669; --dark: #0d3d29; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #f0f2f5; margin: 0; direction: rtl; text-align: right; }

        /* شاشة الدخول */
        .login-screen { position: fixed; inset: 0; background: var(--dark); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        
        /* التطبيق الرئيسي */
        .app-header { background: linear-gradient(135deg, #1e40af, #059669); color: white; padding: 15px; text-align: center; }
        .nav-bar { background: #1f2937; display: flex; justify-content: space-around; sticky: top; }
        .nav-item { color: #9ca3af; padding: 15px; cursor: pointer; border: none; background: none; font-weight: bold; }
        .nav-item.active { color: var(--gold); border-bottom: 3px solid var(--gold); }

        .content { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 1px solid #eee; }
        
        /* الملعب */
        #pitch { width: 100%; height: 450px; background: #2e7d32; border: 3px solid white; position: relative; border-radius: 8px; margin-top: 10px; overflow: hidden; }
        .player { width: 32px; height: 32px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: absolute; cursor: move; border: 2px solid white; font-weight: bold; font-size: 12px; color: black; z-index: 10; }

        .main-btn { background: var(--green); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .hidden { display: none !important; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
    </style>
</head>
<body>

<div id="loginSection" class="login-screen">
    <div class="login-box">
        <h2 style="color: var(--green); margin: 0;">🏆 GFA PRO</h2>
        <p style="font-size: 11px; margin-bottom: 20px;">نظام إدارة النخبة - القائد أمير</p>
        <input type="text" id="lCode" placeholder="كود الدوري">
        <input type="text" id="uName" placeholder="اسمك الكامل">
        <select id="uRole">
            <option value="ADMIN">مشرف (قائد) 🛡️</option>
            <option value="COACH">مدرب 📋</option>
        </select>
        <button class="main-btn" onclick="handleLogin()">دخول الميدان ⚡</button>
    </div>
</div>

<div id="appSection" class="hidden">
    <div class="app-header">
        <h2 id="titleText">PRO COACH</h2>
        <div id="statusBadge" style="color: var(--gold); font-size: 14px;"></div>
    </div>

    <nav class="nav-bar">
        <button class="nav-item active" onclick="openTab('tab1')">🏠 الرئيسية</button>
        <button class="nav-item" onclick="openTab('tab2')">👥 الفريق</button>
        <button class="nav-item" onclick="openTab('tab3')">📐 التكتيك</button>
        <button class="nav-item" id="adminBtn" onclick="openTab('tab4')">⚙️ الإدارة</button>
        <button class="nav-item" onclick="location.reload()" style="color: #ff4444;">🚪 خروج</button>
    </nav>

    <div class="content">
        <div id="tab1" class="page">
            <div class="card">
                <h3>📊 موجز الميدان</h3>
                <p>أهلاً بك يا قائد: <span id="userDisp" style="color: #1e40af; font-weight: bold;"></span></p>
            </div>
        </div>

        <div id="tab2" class="page hidden">
            <div class="card">
                <h3>إضافة لاعب ➕</h3>
                <input type="text" id="playerName" placeholder="الاسم">
                <input type="number" id="playerNum" placeholder="الرقم">
                <button class="main-btn" onclick="savePlayer()">حفظ ✅</button>
            </div>
            <div class="card">
                <table>
                    <thead><tr><th>الاسم</th><th>الرقم</th><th>حذف</th></tr></thead>
                    <tbody id="playerList"></tbody>
                </table>
            </div>
        </div>

        <div id="tab3" class="page hidden">
            <div class="card" style="background: #222;">
                <h3 style="color: white; text-align: center;">غرفة التكتيك 📋</h3>
                <div id="pitch"></div>
                <button class="main-btn" style="background: var(--gold); color: black;" onclick="initPitch()">إعادة الرص 🔄</button>
            </div>
        </div>
