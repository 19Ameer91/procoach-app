<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GFA TITAN v10 | المحرك السيادي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --pitch: #1a5e1a; --white: rgba(255,255,255,0.9); }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #0a0a0a; color: white; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* 🛡️ الهوية البصرية الملكية */
        #brand { position: absolute; top: 20px; left: 25px; z-index: 100; pointer-events: none; }
        #brand h1 { font-size: 32px; font-weight: 900; color: var(--gold); margin: 0; letter-spacing: 2px; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
        #brand span { font-size: 12px; color: #aaa; text-transform: uppercase; border-top: 1px solid var(--gold); }

        /* 🏟️ محرك العرض السينمائي (Perspective) */
        #world { flex: 1; perspective: 1500px; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); }
        
        #pitch { 
            width: 90vw; max-width: 900px; height: 60vh; background: var(--pitch); 
            border: 6px solid white; border-radius: 4px; position: relative;
            transform-style: preserve-3d; transform: rotateX(25deg); /* الزاوية السينمائية */
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            background-image: repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(0,0,0,0.1) 60px, rgba(0,0,0,0.1) 120px);
            box-shadow: 0 50px 100px rgba(0,0,0,0.7);
        }

        /* 🎨 طبقة الرسم التكتيكي */
        #draw-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; touch-action: none; }

        /* ⚽ اللاعبون (تصميم ثلاثي الأبعاد) */
        .player { 
            position: absolute; width: 38px; height: 38px; background: linear-gradient(135deg, var(--gold), #8a6d3b); 
            border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; 
            font-weight: 900; color: black; z-index: 50; cursor: move; transform-style: preserve-3d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4); transition: transform 0.2s;
        }
        .player::after { content: attr(data-name); position: absolute; top: -20px; background: rgba(0,0,0,0.8); color: white; font-size: 9px; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--gold); white-space: nowrap; }

        /* 🏀 الكرة والظل */
        #ball { position: absolute; width: 22px; height: 22px; background: #fff; border-radius: 50%; border: 2px solid #000; z-index: 60; box-shadow: 0 2px 5px rgba(0,0,0,0.5); display: none; }
        #ball-shadow { position: absolute; width: 22px; height: 10px; background: rgba(0,0,0,0.3); border-radius: 50%; z-index: 59; filter: blur(3px); display: none; }

        /* 🛠️ شريط الأدوات السفلي الأيقوني (TacticalPad Style) */
        .bottom-nav { background: rgba(20,20,20,0.95); padding: 15px; display: flex; justify-content: space-around; border-top: 2px solid var(--gold); }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: #888; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { color: var(--gold); transform: translateY(-5px); }
        .nav-icon { width: 24px; height: 24px; border: 2px solid currentColor; border-radius: 5px; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .nav-text { font-size: 10px; font-weight: bold; }

        /* مناطق الجزاء والشبك */
        .box { position: absolute; width: 40%; height: 20%; border: 3px solid white; left: 30%; }
        .top-box { top: 0; border-top: none; } .bot-box { bottom: 0; border-bottom: none; }
    </style>
</head>
<body>

    <div id="brand">
        <h1>GFA TITAN</h1>
        <span>Sovereign Engine v10.0</span>
    </div>

    <div id="world">
        <div id="pitch">
            <canvas id="draw-layer"></canvas>
            <div class="box top-box"></div>
            <div class="box bot-box"></div>
            <div id="ball-shadow"></div>
            <div id="ball"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="applyFormation('442')">
            <div class="nav-icon">442</div>
            <div class="nav-text">تشكيلة</div>
        </div>
        <div class="nav-item active" onclick="setTool('arrow')">
            <div class="nav-icon">↗</div>
            <div class="nav-text">سهم هندسي</div>
        </div>
        <div class="nav-item" onclick="toggleBall()">
            <div class="nav-icon">⚽</div>
            <div class="nav-text">الكرة</div>
        </div>
        <div class="nav-item" style="color: #ff4d4d;" onclick="clearDraw()">
            <div class="nav-icon">×</div>
            <div class="nav-text">مسح</div>
        </div>
        <div class="nav-item" style="color: #059669;" onclick="runCinematic()">
            <div class="nav-icon">▶</div>
            <div class="nav-text">تشغيل سينمائي</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('draw-layer');
        const ctx = canvas.getContext('2d');
        const pitch = document.getElementById('pitch');
        const ball = document.getElementById('ball');
        const shadow = document.getElementById('ball-shadow');
        let path = null;

        window.onload = () => {
            canvas.width = pitch.clientWidth;
            canvas.height = pitch.clientHeight;
            initPlayers();
        };

        // --- محرك الرسم التفاعلي ---
        let drawing = false;
        canvas.onmousedown = canvas.ontouchstart = (e) => {
            drawing = true;
            let r = canvas.getBoundingClientRect();
            let x = (e.clientX || e.touches[0].clientX) - r.left;
            let y = (e.clientY || e.touches[0].clientY) - r.top;
            path = { x1: x, y1: y };
        };

        canvas.onmouseup = canvas.ontouchend = (e) => {
            if(!drawing) return;
            let r = canvas.getBoundingClientRect();
            let x = (e.clientX || e.changedTouches[0].clientX) - r.left;
            let y = (e.clientY || e.changedTouches[0].clientY) - r.top;
            path.x2 = x; path.y2 = y;
            drawTactic(path);
            drawing = false;
        };

        function drawTactic(p) {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.beginPath();
            ctx.setLineDash([5, 5]); ctx.moveTo(p.x1, p.y1); ctx.lineTo(p.x2, p.y2);
            ctx.strokeStyle = "rgba(212,175,55,0.8)"; ctx.lineWidth = 4; ctx.stroke();
            ctx.setLineDash([]);
        }

        // --- المحاكاة السينمائية v10 ---
        function runCinematic() {
            if(!path) return;
            let p = 0;
            ball.style.display = shadow.style.display = "block";
            
            // 🎥 تحريك الكاميرا (ميلان الملعب مع الكرة)
            pitch.style.transform = "rotateX(35deg) scale(1.1) translateY(20px)";

            function animate() {
                if(p <= 1) {
                    let x = path.x1 + (path.x2 - path.x1) * p;
                    let y = path.y1 + (path.y2 - path.y1) * p;
                    let h = 120 * Math.sin(Math.PI * p); // ارتفاع الكرة
                    
                    ball.style.left = (x - 11) + "px";
                    ball.style.top = (y - 11 - h) + "px";
                    ball.style.transform = `scale(${1 + h/100})`;
                    
                    shadow.style.left = (x - 11) + "px";
                    shadow.style.top = (y - 5) + "px";
                    shadow.style.transform = `scale(${1 - h/200})`;

                    p += 0.015;
                    requestAnimationFrame(animate);
                } else {
                    pitch.style.transform = "rotateX(25deg) scale(1)"; // عودة الكاميرا
                }
            }
            animate();
        }

        // --- نظام اللاعبين والتشكيلات ---
        const names = ["الحارس", "دفاع", "دفاع", "ظهير", "ظهير", "وسط", "وسط", "جناح", "جناح", "هجوم", "هجوم"];
        function initPlayers() {
            for(let i=0; i<11; i++) {
                let pl = document.createElement('div');
                pl.className = 'player';
                pl.innerText = i+1;
                pl.setAttribute('data-name', names[i]);
                pl.style.left = (10 + i*7) + "%"; pl.style.top = "45%";
                makeDraggable(pl);
                pitch.appendChild(pl);
            }
        }

        function makeDraggable(el) {
            let move = false;
            el.onmousedown = el.ontouchstart = () => move = true;
            window.onmousemove = window.ontouchmove = (e) => {
                if(!move) return;
                let r = pitch.getBoundingClientRect();
                let x = (e.clientX || e.touches[0].clientX) - r.left;
                let y = (e.clientY || e.touches[0].clientY) - r.top;
                el.style.left = (x - 19) + "px"; el.style.top = (y - 19) + "px";
            };
            window.onmouseup = window.ontouchend = () => move = false;
        }

        function clearDraw() { ctx.clearRect(0,0,canvas.width, canvas.height); path = null; }
        function toggleBall() { ball.style.display = (ball.style.display === 'block' ? 'none' : 'block'); }
    </script>
</body>
</html>
