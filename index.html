<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GFA SOVEREIGN - TACTICAL SIMULATOR v5 🛡️</title>
    <style>
        :root { --gold: #d4af37; --pitch: #2e7d32; --white: rgba(255,255,255,0.8); }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #1a1a1a; color: white; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* 🛠️ لوحة التحكم المتقدمة */
        .control-panel { background: #222; padding: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; border-bottom: 3px solid var(--gold); z-index: 1000; }
        .btn-tactic { background: #444; color: white; border: 1px solid var(--gold); padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-tactic:hover { background: var(--gold); color: black; }
        .btn-play { background: #059669 !important; border-color: #fff !important; animation: pulse 1s infinite; }

        /* 🏟️ الميدان التفاعلي */
        #arena-map { flex: 1; position: relative; width: 100%; display: flex; justify-content: center; align-items: center; background: #111; }
        #pitch { 
            width: 90%; max-width: 700px; height: 85%; background: var(--pitch); 
            border: 5px solid white; border-radius: 10px; position: relative; overflow: hidden;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,0,0,0.03) 40px, rgba(0,0,0,0.03) 80px);
        }

        #draw-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; touch-action: none; }

        /* ⚽ الكرة الذكية */
        #ball { 
            position: absolute; width: 20px; height: 20px; background: white; 
            border-radius: 50%; border: 2px solid black; z-index: 50; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); transition: none;
        }

        .player { 
            position: absolute; width: 32px; height: 32px; background: var(--gold); 
            border-radius: 50%; border: 2px solid white; display: flex; 
            align-items: center; justify-content: center; font-weight: bold; 
            color: black; cursor: move; z-index: 100; font-size: 12px;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="control-panel">
    <button class="btn-tactic" onclick="setMode('arrow')">📏 رسم سهم تمرير</button>
    <button class="btn-tactic" onclick="clearAll()">🗑️ مسح الميدان</button>
    <button class="btn-tactic btn-play" onclick="simulateAction()">▶️ تنفيذ الهجمة (محاكاة)</button>
</div>

<div id="arena-map">
    <div id="pitch">
        <canvas id="draw-layer"></canvas>
        <div id="ball" style="top:50%; left:50%;"></div>
        </div>
</div>

<script>
    // --- 1. إصلاح حركة الجميع (الـ 11 لاعباً) ---
    function initPlayers() {
        const pitch = document.getElementById('pitch');
        pitch.querySelectorAll('.player').forEach(p => p.remove()); // تنظيف
        
        for(let i=1; i<=11; i++) {
            const p = document.createElement('div');
            p.className = 'player';
            p.innerText = i;
            // توزيع ذكي مبدئي
            p.style.top = (20 + (i*5)) + "%";
            p.style.left = (10 + (i*7)) + "%";
            
            // تفعيل السحب (كل لاعب له ذاكرة حركة مستقلة)
            makeDraggable(p, pitch);
            pitch.appendChild(p);
        }
    }

    // --- 2. محرك الكرة الساقطة (Arc Motion) ---
    function simulateAction() {
        if(!lastArrow) return alert("ارسم مسار الهجمة أولاً!");
        
        let progress = 0;
        const speed = 0.015; 
        const ball = document.getElementById('ball');

        function animate() {
            if (progress <= 1) {
                // إحداثيات مستقيمة
                const x = lastArrow.x1 + (lastArrow.x2 - lastArrow.x1) * progress;
                const y = lastArrow.y1 + (lastArrow.y2 - lastArrow.y1) * progress;
                
                // تأثير الكرة الساقطة (الارتفاع البرمجي)
                // نستخدم معادلة القطع المكافئ: h = 4 * height * progress * (1 - progress)
                const jumpHeight = 60; // قوة الارتفاع
                const offset = 4 * jumpHeight * progress * (1 - progress);
                
                ball.style.left = (x - 10) + "px";
                ball.style.top = (y - 10 - offset) + "px"; // ترتفع ثم تنخفض
                
                // تغيير حجم الكرة ليوحي بالارتفاع (تأثير بصري)
                const scale = 1 + (offset / 100);
                ball.style.transform = `scale(${scale})`;

                progress += speed;
                requestAnimationFrame(animate);
            } else {
                ball.style.transform = `scale(1)`;
                alert("⚽ تم تنفيذ الكرة الساقطة بنجاح!");
            }
        }
        animate();
    }

    // --- 3. تصحيح وظيفة السحب الموحدة ---
    function makeDraggable(el, container) {
        let isMoving = false;
        
        const start = (e) => { 
            isMoving = true; 
            el.style.zIndex = 1000; 
            e.stopPropagation(); // منع تداخل السحب مع الرسم
        };
        
        const move = (e) => {
            if (!isMoving) return;
            const r = container.getBoundingClientRect();
            const cx = (e.clientX || e.touches[0].clientX) - r.left;
            const cy = (e.clientY || e.touches[0].clientY) - r.top;
            
            // الحفاظ على اللاعب داخل الميدان
            if(cx > 0 && cx < r.width && cy > 0 && cy < r.height) {
                el.style.left = (cx - 16) + "px";
                el.style.top = (cy - 16) + "px";
            }
        };

        const stop = () => { isMoving = false; };

        el.onmousedown = el.ontouchstart = start;
        window.addEventListener('mousemove', move);
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('mouseup', stop);
        window.addEventListener('touchend', stop);
    }
</script>
</body>
</html>
